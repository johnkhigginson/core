rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: todo
    comment: The documentation page has no section on removing the integration.
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name:
    status: todo
    comment: |
      Zone and schedule switches set their own full name and do not use
      has_entity_name. Changing this renames existing entities.
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: todo
    comment: |
      Actions raise HomeAssistantError with untranslated text, and API errors
      from pause, resume and standby calls are not checked.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: todo
    comment: |
      Smart hose timer entities become unavailable, but controller zone,
      schedule, standby, rain delay and binary sensor entities never do.
  integration-owner: done
  log-when-unavailable:
    status: todo
    comment: |
      The coordinators log once when unavailable and on recovery. Controller
      entities are push based and do not log when the device goes offline.
  parallel-updates:
    status: todo
    comment: PARALLEL_UPDATES is not set on any platform.
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: Test coverage is about 80%, below the required 95%.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: The integration is cloud based and does not store a host or IP address.
  discovery:
    status: todo
    comment: |
      DHCP and zeroconf are listed in the manifest but the config flow only
      handles HomeKit discovery.
  docs-data-update: done
  docs-examples:
    status: todo
    comment: Only a groups.yaml example exists. There are no automation examples.
  docs-known-limitations:
    status: todo
    comment: Limitations are mentioned in places but not collected in one section.
  docs-supported-devices:
    status: todo
    comment: The documentation does not list the supported Rachio controller models.
  docs-supported-functions: done
  docs-troubleshooting:
    status: todo
    comment: The documentation has no troubleshooting section.
  docs-use-cases:
    status: todo
    comment: The documentation does not describe use cases.
  dynamic-devices:
    status: todo
    comment: Zones, schedules and valves are only created at setup.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: todo
    comment: No entities are disabled by default. Schedule switches could be.
  entity-translations:
    status: done
    comment: Zones, schedules and valves are named after the user's own labels.
  exception-translations:
    status: todo
    comment: Setup errors are translated, but action errors are not.
  icon-translations:
    status: todo
    comment: |
      Zone and schedule switches set icons in code instead of icons.json.
  reconfiguration-flow:
    status: todo
    comment: There is no reconfigure step to change the API key.
  repair-issues:
    status: exempt
    comment: The integration has no user-fixable issues that need a repair.
  stale-devices:
    status: todo
    comment: Devices removed from the Rachio account are not removed from Home Assistant.

  # Platinum
  async-dependency:
    status: todo
    comment: RachioPy is synchronous and runs in the executor.
  inject-websession:
    status: todo
    comment: RachioPy uses requests and cannot take a shared web session.
  strict-typing:
    status: todo
    comment: The integration is not in .strict-typing.
